<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Miguel Mondragon — Diamante &amp; Santuario</title>
<meta name="description" content="Catálogo fotográfico de Privada Diamante y Residencial Santuario, Franco, Silao." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Nuevo Comienzo" />
<meta property="og:title" content="Nuevo Comienzo — Diamante &amp; Santuario" />
<meta property="og:description" content="Catálogo fotográfico de Privada Diamante y Residencial Santuario, Franco, Silao." />
<meta property="og:image" content="https://watsapp-voice-agent.onrender.com/galeria/fotos/Diamante/01%20Para%20Redes%20(Asesores)/Diamante%20-%20Casa%20Modelo%20Diamante%20-%20%242%2C900%2C000/00_FOLLETO.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__mark">MM</span>
    <div class="topbar__names">
      <strong>Miguel Mondragon</strong>
      <span>Franco, Silao · Gto.</span>
    </div>
  </div>
  <div class="topbar__projects" id="proyectoTabs" role="tablist" aria-label="Proyecto"></div>
</header>

<main>
  <section class="controls">
    <div class="controls__search">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="buscador" type="search" placeholder="Buscar modelo…" autocomplete="off" />
    </div>
    <div class="controls__sort">
      <label for="orden">Ordenar</label>
      <select id="orden">
        <option value="default">Como en el catálogo</option>
        <option value="precioAsc">Precio: menor a mayor</option>
        <option value="precioDesc">Precio: mayor a menor</option>
      </select>
    </div>
    <button id="btnModoSeleccion" class="btn btn--seleccion" type="button">Seleccionar</button>
  </section>

  <section id="grid" class="grid" aria-live="polite"></section>

  <p id="vacio" class="vacio" hidden>No encontramos ningún modelo con ese nombre.</p>
</main>

<!-- Barra flotante de selección múltiple -->
<div id="barraSeleccion" class="barra-seleccion" hidden>
  <span id="seleccionContador">0 seleccionadas</span>
  <div class="barra-seleccion__botones">
    <button id="btnCancelarSeleccion" class="btn btn--ghost" type="button">Cancelar</button>
    <button id="btnCompartirSeleccion" class="btn btn--ghost-light" type="button">Compartir</button>
  </div>
</div>

<!-- Vista de detalle a pantalla completa -->
<div id="visor" class="visor" hidden role="dialog" aria-modal="true">
  <div class="visor__top">
    <button id="visorCerrar" class="icon-btn" aria-label="Cerrar">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="visor__titulo">
      <strong id="visorNombre"></strong>
      <span id="visorPrecio"></span>
    </div>
    <button id="visorCompartirModelo" class="icon-btn" aria-label="Compartir modelo completo">
      <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M14 5.5a2 2 0 1 0-1.9-2.6M14 5.5a2 2 0 0 1-1.9-2.6M14 5.5 6.9 9.4M6.9 9.4a2 2 0 1 1 0 2M6.9 9.4l6.2 3.6m0 0a2 2 0 1 0 1.9 2.6m-1.9-2.6a2 2 0 0 1 1.9 2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="visor__tabs" id="visorTabs"></div>

  <div class="visor__stage">
    <button id="visorPrev" class="visor__arrow visor__arrow--prev" aria-label="Foto anterior">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M13.5 5.5 7 11l6.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="visor__imgwrap" id="visorImgWrap">
      <img id="visorImg" alt="" />
    </div>
    <button id="visorNext" class="visor__arrow visor__arrow--next" aria-label="Foto siguiente">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M8.5 5.5 15 11l-6.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="visor__bottom">
    <span id="visorContador" class="visor__contador"></span>
    <button id="visorCompartirFoto" class="btn btn--ghost-light">Compartir esta foto</button>
  </div>

  <div class="visor__tiras" id="visorTiras"></div>
</div>

<script src="app.js"></script>
</body>
</html>
