<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos - Proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Galería de Fotos</h1>
        <p>Imágenes cargadas desde la carpeta <code>public-galeria/fotos</code></p>
    </header>

    <main>
        <div id="contenedor-galeria" class="galeria-grid">
            <!-- Las imágenes se cargarán aquí automáticamente o puedes agregarlas estáticamente -->
            <div class="foto-card">
                <img src="public-galeria/fotos/ejemplo1.jpg" alt="Foto de ejemplo 1" onerror="this.src='https://via.placeholder.com/300x200?text=Sube+tu+foto+aqui'">
                <p>ejemplo1.jpg</p>
            </div>
        </div>
    </main>

    <footer>
        <p>Proyecto Watsapp Voice Agent - Preparado para cuando active el asistente.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
